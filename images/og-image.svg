<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="gallerySpot" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.12"/>
      <stop offset="40%" stop-color="#d4af37" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0"/>
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Deep Black Gallery Wall -->
  <rect width="1200" height="630" fill="#050505"/>
  <rect width="1200" height="630" fill="url(#gallerySpot)"/>

  <!-- Museum Frame Border -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#d4af37" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Top Badge -->
  <text x="600" y="210" font-family="'Cinzel', Georgia, serif" font-size="18" font-weight="600" fill="#d4af37" text-anchor="middle" letter-spacing="6">INDIE GAME ATELIER</text>

  <!-- Main Title -->
  <text x="600" y="320" font-family="'Cormorant Garamond', Georgia, serif" font-size="76" font-weight="300" fill="#f5f0e6" text-anchor="middle" letter-spacing="8">DIMENSIONNODE</text>

  <!-- Gold Divider -->
  <line x1="450" y1="370" x2="750" y2="370" stroke="url(#goldLine)" stroke-width="1"/>

  <!-- Subtitle -->
  <text x="600" y="430" font-family="'Inter', sans-serif" font-size="20" font-weight="300" fill="#9e9a93" text-anchor="middle" letter-spacing="3">CRAFTING SERENE, ATMOSPHERIC INTERACTIVE WORLDS</text>
</svg>
