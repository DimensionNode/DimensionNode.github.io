<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <circle cx="600" cy="315" r="400" fill="url(#glow)"/>

  <!-- Geometric Dimension Node Icon -->
  <g transform="translate(600, 220) scale(3.5)">
    <polygon points="0,-25 22,-12 22,12 0,25 -22,12 -22,-12" stroke="url(#accentGrad)" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="5" fill="url(#accentGrad)"/>
    <line x1="0" y1="-25" x2="0" y2="-7" stroke="url(#accentGrad)" stroke-width="1.8"/>
    <line x1="0" y1="7" x2="0" y2="25" stroke="url(#accentGrad)" stroke-width="1.8"/>
    <line x1="-22" y1="-12" x2="-6" y2="0" stroke="url(#accentGrad)" stroke-width="1.8"/>
    <line x1="6" y1="0" x2="22" y2="12" stroke="url(#accentGrad)" stroke-width="1.8"/>
    <line x1="22" y1="-12" x2="6" y2="0" stroke="url(#accentGrad)" stroke-width="1.8"/>
    <line x1="-6" y1="0" x2="-22" y2="12" stroke="url(#accentGrad)" stroke-width="1.8"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="600" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="bold" fill="#e6edf3" text-anchor="middle" letter-spacing="-1">DimensionNode</text>
  <text x="600" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="normal" fill="#8b949e" text-anchor="middle">Indie Game Developer Portfolio</text>

  <!-- Bottom Accent Bar -->
  <rect x="520" y="520" width="160" height="4" rx="2" fill="url(#accentGrad)"/>
</svg>
